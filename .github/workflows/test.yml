name: test

on:
  push:
  pull_request:

jobs:
  test:
    # macOS only: the package and its native helper are macOS-only. Everything
    # here runs without a Connect IQ simulator (the live tests need one).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
