name: Bug report
description: Something the server did wrong or could not do
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool call, what it returned, and what you expected.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: The output of `npx -y owl-watch-simulator-mcp --doctor`.
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS release and display
      placeholder: macOS 27.0, Apple silicon, built-in Retina display
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: Connect IQ SDK version and device
      placeholder: 8.3.0, fenix843mm
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code, Cursor, VS Code...
